    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crypto Coach AI</title>
    <script>
      const currentPath = window.location.pathname;
      const basePath = '/ai-crypto-coach/';
      
      if (currentPath !== basePath) {
        window.location.replace(basePath + '?redirect=' + encodeURIComponent(currentPath.replace(basePath, '')));
      } else {
        window.location.replace(basePath);
      }
    </script>
  </head>
